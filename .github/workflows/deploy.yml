name: Deploy to GoDaddy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        working-directory: react-app
        run: npm ci

      - name: Lint
        working-directory: react-app
        run: npm run lint

      - name: Build
        working-directory: react-app
        run: npm run build

      - name: Copy static assets to dist
        working-directory: react-app
        run: |
          cp -r public/assets dist/ 2>/dev/null || true
          cp public/favicon.svg dist/ 2>/dev/null || true
          cp public/site.webmanifest dist/ 2>/dev/null || true
          cp public/robots.txt dist/ 2>/dev/null || true
          cp public/sitemap.xml dist/ 2>/dev/null || true

      - name: Verify secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "=== SECRETS CHECK ==="
          echo "FTP_SERVER length: ${#FTP_SERVER}"
          echo "FTP_USERNAME length: ${#FTP_USERNAME}"
          echo "FTP_PASSWORD length: ${#FTP_PASSWORD}"
          echo "====================="

      - name: Debug FTP download
        env:
          FTP_SERVER: 148.72.0.96
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          mkdir -p /tmp/ftpcheck
          for p in "." "public_html"; do
            tgt="${p}"
            [ "$p" = "." ] && tgt="."
            echo "=== descargando /${tgt}/index.html ==="
            curl -v --ftp-ssl --ciphers DEFAULT@SECLEVEL=1 --connect-timeout 15 --max-time 90 -u "${FTP_USERNAME}:${FTP_PASSWORD}" -o "/tmp/ftpcheck/index-${p//\//_}.html" "ftp://${FTP_SERVER}/${tgt}/index.html" 2>&1 | grep -E "Connected|error|Error|RETR|229|230|550|Failed|PBSZ|new connections|Passive" | head -8
            if [ -s "/tmp/ftpcheck/index-${p//\//_}.html" ]; then
              echo "hash: $(sha256sum /tmp/ftpcheck/index-${p//\//_}.html | cut -d' ' -f1)"
              echo "refs: $(grep -oE 'index-[A-Za-z0-9_-]+\.js' /tmp/ftpcheck/index-${p//\//_}.html | sort -u | head -3)"
            else
              echo "(no existe o vacío)"
            fi
          done
          echo "=== build local refs ==="
          grep -oE 'index-[A-Za-z0-9_-]+\.js' react-app/dist/index.html | sort -u | head -3

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: 148.72.0.96
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: react-app/dist/
          server-dir: /
          protocol: ftps
          port: 21
          timeout: 30000
          exclude: |
            *.tar.gz
            *.zip
