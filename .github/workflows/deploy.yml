name: Deploy to GoDaddy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        working-directory: react-app
        run: npm ci

      - name: Lint
        working-directory: react-app
        run: npm run lint

      - name: Build
        working-directory: react-app
        run: npm run build

      - name: Copy static assets to dist
        working-directory: react-app
        run: |
          cp -r public/assets dist/ 2>/dev/null || true
          cp public/favicon.svg dist/ 2>/dev/null || true
          cp public/site.webmanifest dist/ 2>/dev/null || true
          cp public/robots.txt dist/ 2>/dev/null || true
          cp public/sitemap.xml dist/ 2>/dev/null || true
          echo "marker-$(date -u +%s)" > dist/marker-unico-0913.txt

      - name: Verify secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "=== SECRETS CHECK ==="
          echo "FTP_SERVER length: ${#FTP_SERVER}"
          echo "FTP_USERNAME length: ${#FTP_USERNAME}"
          echo "FTP_PASSWORD length: ${#FTP_PASSWORD}"
          echo "====================="

      - name: Debug FTP listing
        env:
          FTP_SERVER: 148.72.0.96
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for d in "" "public_html" "corpogaviotas.org" "domains/corpogaviotas.org" "www" "html" "app" "htdocs"; do
            url="ftp://${FTP_SERVER}/"
            [ -n "$d" ] && url="ftp://${FTP_SERVER}/${d}/"
            out=$(curl -skS --ssl-reqd --connect-timeout 15 --max-time 40 -u "${FTP_USERNAME}:${FTP_PASSWORD}" "$url" 2>&1)
            echo "=== /${d} ==="
            printf '%s\n' "$out" | head -40
          done
        continue-on-error: true

      - name: Debug FTP listing assets
        env:
          FTP_SERVER: 148.72.0.96
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for d in "assets" "assets/gallery" "assets/institucional" "public_html/assets"; do
            url="ftp://${FTP_SERVER}/${d}/"
            echo "=== /${d} ==="
            curl -skS --ssl-reqd --connect-timeout 15 --max-time 40 -u "${FTP_USERNAME}:${FTP_PASSWORD}" "$url" 2>&1 | head -25
          done
        continue-on-error: true

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: 148.72.0.96
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: react-app/dist/
          server-dir: /
          protocol: ftps
          port: 21
          timeout: 30000
          exclude: |
            *.tar.gz
            *.zip
