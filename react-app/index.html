        {
          "@type": "Question",
          "name": "¿Qué es la Integración Popular Gaviotas Corporación?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Es una organización sin ánimo de lucro (ESAL) dedicada al desarrollo cívico, cultural, educativo, deportivo, económico y social de las comunidades de Cali y sus corregimientos, en especial de aquellas en condición de vulnerabilidad. Fundada el 30 de enero de 1990, NIT 800233121-5."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué es La Ruta de los Oficios?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Es un proyecto productivo de la línea Mujeres Empresarias que une seis oficios — artesanías, gastronomía, agroecoturismo, agropecuario, técnicos y profesionales — en una ruta agro-turística que conecta el oficio de las mujeres con el territorio del Valle del Cauca."
          }
        },
        {
          "@type": "Question",
          "name": "¿Dónde está ubicada la Corporación?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Su oficina principal se encuentra en Carrera 25 # 42 a 28, Cali, Valle del Cauca, Colombia. Atiende las comunas 12, 1, 4 y 17."
          }
        },
        {
          "@type": "Question",
          "name": "¿Desde cuándo funciona la Corporación?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Fundada el 30 de enero de 1990, inscrita en Cámara de Comercio de Cali con registro 847-50 el 21 de abril de 1997. Cuenta con más de 35 años de trayectoria en desarrollo comunitario."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuáles son los valores corporativos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Veracidad, Bondad y Respeto. Estos valores orientan la calidad en los servicios prestados, manteniendo un índice de cumplimiento excelente."
          }
        }
